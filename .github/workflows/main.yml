name: laravel-ci

# Fast PHP quality + supply-chain gate: Pest, Pint and a Composer security audit.
# GitHub is the primary host while cronmon is in active development; the GitLab
# pipeline (.gitlab-ci.yml) takes over build/test/deploy once the app moves to
# GitLab for QA.
# Tests run against a MySQL service to match the production database — the
# step-level DB_* env vars win over phpunit.xml's sqlite defaults because
# PHPUnit <env> entries don't override real environment variables.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laravel-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pest, Pint & audit
    runs-on: ubuntu-latest

    services:
      mysql:
        # mysql:5.7 digest-pinned 2026-06-10 — matches the production DB version;
        # 5.7 is EOL so the tag no longer moves (upgrade candidate, tracked)
        image: mysql:5.7@sha256:4bc6bc963e6d8443453676cae56536f4b8156d78bae03c0145cbe47c2aad73bb
        env:
          MYSQL_ROOT_PASSWORD: homestead
          MYSQL_DATABASE: homestead
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up PHP
        # PHP version tracks .lando.yml (which matches production). Bump both together.
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Authenticate Flux Pro
        run: composer config --global --auth http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend assets
        run: npm run build

      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests (Pest)
        run: php artisan test --parallel
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: homestead
          DB_USERNAME: root
          DB_PASSWORD: homestead

      - name: Check code style (Pint)
        if: ${{ !cancelled() }}
        run: vendor/bin/pint --test

      - name: Security audit (Composer)
        if: ${{ !cancelled() }}
        run: composer audit
